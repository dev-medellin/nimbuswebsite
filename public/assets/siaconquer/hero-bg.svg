<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f05"/>
      <stop offset="30%" style="stop-color:#1f260a"/>
      <stop offset="60%" style="stop-color:#2e3a12"/>
      <stop offset="100%" style="stop-color:#0b0f05"/>
    </linearGradient>

    <!-- Olive Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#b5a76a;stop-opacity:0.25"/>
      <stop offset="50%" style="stop-color:#3e4f1c;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0b0f05;stop-opacity:1"/>
    </radialGradient>

    <!-- Texture -->
    <pattern id="texture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#0b0f05"/>
      <path d="M0,0 L100,100 M100,0 L0,100"
            stroke="#1f260a"
            stroke-width="0.5"
            opacity="0.25"/>
      <circle cx="50" cy="50" r="30"
              fill="none"
              stroke="#2e3a12"
              stroke-width="0.3"
              opacity="0.2"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#heroBgGrad)"/>

  <!-- Glow -->
  <rect width="1920" height="1080" fill="url(#glowGrad)"/>

  <!-- Texture -->
  <rect width="1920" height="1080" fill="url(#texture)" opacity="0.35"/>

  <!-- Waves -->
  <path d="M0,300 Q480,200 960,300 T1920,300"
        stroke="#b5a76a"
        stroke-width="2"
        fill="none"
        opacity="0.15"
        filter="url(#glow)"/>

  <path d="M0,500 Q480,400 960,500 T1920,500"
        stroke="#556b2f"
        stroke-width="1.5"
        fill="none"
        opacity="0.12"
        filter="url(#glow)"/>

  <path d="M0,700 Q480,600 960,700 T1920,700"
        stroke="#3e4f1c"
        stroke-width="1"
        fill="none"
        opacity="0.1"
        filter="url(#glow)"/>

  <!-- Circles -->
  <circle cx="200" cy="200" r="150"
          fill="none"
          stroke="#b5a76a"
          stroke-width="1"
          opacity="0.08"
          filter="url(#glow)"/>

  <circle cx="1720" cy="300" r="120"
          fill="none"
          stroke="#556b2f"
          stroke-width="1"
          opacity="0.08"
          filter="url(#glow)"/>

  <circle cx="500" cy="800" r="100"
          fill="none"
          stroke="#3e4f1c"
          stroke-width="1"
          opacity="0.07"
          filter="url(#glow)"/>

  <circle cx="1500" cy="900" r="130"
          fill="none"
          stroke="#b5a76a"
          stroke-width="1"
          opacity="0.08"
          filter="url(#glow)"/>

  <!-- Light Rays -->
  <g opacity="0.12">
    <line x1="960" y1="0" x2="800" y2="1080"
          stroke="#b5a76a"
          stroke-width="2"
          filter="url(#glow)"/>
    <line x1="960" y1="0" x2="1120" y2="1080"
          stroke="#b5a76a"
          stroke-width="2"
          filter="url(#glow)"/>
    <line x1="960" y1="0" x2="960" y2="1080"
          stroke="#556b2f"
          stroke-width="1.5"
          filter="url(#glow)"/>
  </g>

  <!-- Particles -->
  <g opacity="0.18">
    <circle cx="300" cy="400" r="3" fill="#b5a76a" filter="url(#glow)"/>
    <circle cx="600" cy="250" r="2" fill="#556b2f" filter="url(#glow)"/>
    <circle cx="1200" cy="350" r="2.5" fill="#b5a76a" filter="url(#glow)"/>
    <circle cx="1500" cy="500" r="2" fill="#3e4f1c" filter="url(#glow)"/>
    <circle cx="800" cy="700" r="3" fill="#b5a76a" filter="url(#glow)"/>
    <circle cx="400" cy="900" r="2" fill="#556b2f" filter="url(#glow)"/>
    <circle cx="1600" cy="800" r="2.5" fill="#b5a76a" filter="url(#glow)"/>
  </g>

</svg>